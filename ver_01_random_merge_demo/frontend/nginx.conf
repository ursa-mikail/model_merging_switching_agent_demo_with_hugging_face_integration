server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Proxy API calls (including Server-Sent Events) to the Go backend.
    # SSE needs buffering disabled and no read timeout so log streams flow
    # through live instead of being held back by nginx's proxy buffer.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA fallback: any other route serves index.html so client-side routing
    # (if added later) keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
