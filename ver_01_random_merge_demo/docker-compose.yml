services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hf-mergekit-demo-backend:latest
    container_name: hf-mergekit-demo-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATA_DIR=/data
    ports:
      # Exposed directly too, so the API can be hit without going through
      # the frontend's nginx proxy (handy for debugging with curl).
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - model_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hf-mergekit-demo-frontend:latest
    container_name: hf-mergekit-demo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  model_data:
    name: hf-mergekit-demo-model-data
